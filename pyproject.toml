[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "build",
    "krita",
    "comfyui",
    "shared",
]

[tool.uv.sources]
shared = { workspace = true, editable = true }

# This is required so that it will update the shared package when building
[tool.uv]
reinstall-package = ["shared"]

[dependency-groups]
dev = [
    "pyqt6>=6.11.0",
    "pyright>=1.1.409",
]
